figure_params:
  confusion_matrix:
    title: Binary Classifier Confusion Matrix
  ig_bubble:
    top_k: 12
  attention_heatmap:
    top_k: 15
  selection_frequency:
    threshold: 0.8
  trajectory_profiles:
