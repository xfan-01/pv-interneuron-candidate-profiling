# Generator decoder ablation configuration
# Replicates the four-variant ablation from demo/generator_ablation_3.ipynb
seed: 42
run_seeds: [42, 66, 88]
data:
  h5ad_path: data/labelled_data.h5ad
  subset_col: trajectory_class
  subset_values: [PV]
  time_col: refined_pseudotime
  cluster_col: leiden_0.2_c6
  n_bins: 120
  allowed_offsets: [1, 2, 3, 4, 5, 6]
  base_max_dist: 12.0
  dist_alpha: 1.0
  allowed_cross_steps: [1, 2]
  k_intra: 1
  k_cross: 2
  val_split: 0.2
  heldout_split: 0.1
model:
  n_genes: 2134
  max_len: 1000
  d_model: 256
  n_heads: 4
  n_encoder_layers: 4
  n_query_self_layers: 2
  n_query_cross_layers: 1
  dropout: 0.1
training:
  batch_size: 128
  epochs: 100
  warmup_epochs: 5
  patience: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  mask_prob: 0.30
  base_mask_prob: 0.30
  time_jitter_std: 0.005
  use_accumulation: true
  accumulation_steps: 1
  use_amp: true
  save_dir: checkpoints/forecasting_ablation
  eval_batch_size: 128
  eval_sample_n: 2000
loss:
  lambda_nz: 1.0
  lambda_z_l1: 1.0
  lambda_z_l2: 1.0
  lambda_nzcos: 0.5
  min_genes_for_cos: 5
variants:
  - name: full_model
    label: Full model
    use_query_self_attention: true
    use_query_cross_attention: true
    plain_decoder: false
  - name: wo_query_self_attention
    label: w/o query self-attention
    use_query_self_attention: false
    use_query_cross_attention: true
    plain_decoder: false
  - name: wo_query_cross_attention
    label: w/o query cross-attention
    use_query_self_attention: true
    use_query_cross_attention: false
    plain_decoder: false
  - name: plain_decoder
    label: Plain decoder
    use_query_self_attention: false
    use_query_cross_attention: false
    plain_decoder: true


